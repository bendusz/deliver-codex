developer_instructions = '''
Read the task packet, applicable AGENTS.md instructions and only the referenced contracts and code. Implement the stated objective inside touches. Read paths are context, not write permission. Never edit plan, approval, run state, evidence, agent configuration or unrelated work. Do not commit, merge, push, install dependencies or delegate.
